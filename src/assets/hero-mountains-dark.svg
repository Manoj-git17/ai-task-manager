<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090b14"/>
      <stop offset="40%" stop-color="#121526"/>
      <stop offset="75%" stop-color="#1e183a"/>
      <stop offset="100%" stop-color="#131627"/>
    </linearGradient>

    <!-- Celestial / Nebula Violet Glow -->
    <radialGradient id="nebulaGlow" cx="65%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#121526" stop-opacity="0"/>
    </radialGradient>

    <!-- Mountain Layer 1 (Far - Indigo silhouette) -->
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2554"/>
      <stop offset="100%" stop-color="#15172b"/>
    </linearGradient>

    <!-- Mountain Layer 2 (Mid - Slate Indigo) -->
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f233f"/>
      <stop offset="100%" stop-color="#111322"/>
    </linearGradient>

    <!-- Mountain Layer 3 (Foreground - Midnight Obsidian) -->
    <linearGradient id="mountainClose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151829"/>
      <stop offset="100%" stop-color="#0b0d17"/>
    </linearGradient>

    <!-- Bottom Vignette Blend -->
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0b0d17" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b0d17" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1400" height="420" fill="url(#skyGradDark)"/>
  <rect width="1400" height="420" fill="url(#nebulaGlow)"/>

  <!-- Distant Stars & Cosmic Accents -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="85" cy="45" r="1.2"/>
    <circle cx="160" cy="85" r="0.9"/>
    <circle cx="240" cy="35" r="1.4" opacity="0.8"/>
    <circle cx="310" cy="110" r="0.8"/>
    <circle cx="430" cy="50" r="1.1"/>
    <circle cx="520" cy="80" r="1.5" opacity="0.9"/>
    <circle cx="680" cy="40" r="1"/>
    <circle cx="760" cy="95" r="1.3"/>
    <circle cx="890" cy="55" r="1.2"/>
    <circle cx="980" cy="105" r="0.9"/>
    <circle cx="1120" cy="45" r="1.6" opacity="0.95"/>
    <circle cx="1230" cy="75" r="1"/>
    <circle cx="1320" cy="30" r="1.3"/>
    <circle cx="1360" cy="115" r="0.8"/>
  </g>

  <!-- Ambient Moon/Horizon Rim Glow -->
  <ellipse cx="920" cy="190" rx="320" ry="110" fill="#a78bfa" opacity="0.12"/>
  <ellipse cx="460" cy="220" rx="260" ry="90" fill="#6366f1" opacity="0.09"/>

  <!-- Far Mountain Range (Dramatic Alpine peaks) -->
  <path d="M 0 290 
           L 110 240 L 195 270 L 320 200 L 410 250 L 530 185 L 640 245 L 770 170 
           L 890 235 L 1010 165 L 1130 225 L 1260 175 L 1350 220 L 1400 195 
           L 1400 420 L 0 420 Z" 
        fill="url(#mountainFar)" opacity="0.75"/>

  <!-- Mid Mountain Range with Ridge Shading -->
  <path d="M 0 320 
           L 90 285 L 210 325 L 340 255 L 470 310 L 610 230 L 730 295 L 860 220 
           L 990 280 L 1110 215 L 1220 270 L 1340 225 L 1400 250 
           L 1400 420 L 0 420 Z" 
        fill="url(#mountainMid)" opacity="0.9"/>

  <!-- Foreground Mountain Ridge -->
  <path d="M 0 355 
           L 140 315 L 280 360 L 440 285 L 590 345 L 750 275 L 910 335 L 1070 265 
           L 1210 320 L 1330 280 L 1400 305 
           L 1400 420 L 0 420 Z" 
        fill="url(#mountainClose)"/>

  <!-- Fine Rim Light on Foreground Peaks -->
  <path d="M 0 355 L 140 315 L 280 360 L 440 285 L 590 345 L 750 275 L 910 335 L 1070 265 L 1210 320 L 1330 280 L 1400 305" 
        fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Soft Bottom Blend Gradient -->
  <rect y="240" width="1400" height="180" fill="url(#bottomFade)"/>
</svg>
